<!doctype html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Knowrizon AI — Your personal AI study companion. Upload notes, ask questions, generate quizzes, and learn faster with adaptive AI tutoring." />
    <meta property="og:title" content="Knowrizon AI — Learn Smarter" />
    <meta property="og:description" content="AI-powered adaptive learning platform for students." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Knowrizon AI — Your Personal AI Study Companion</title>
    <script>
      (function() {
        try {
          var isMigrated = localStorage.getItem('knowrizon-theme-default-v2');
          if (!isMigrated) {
            localStorage.setItem('knowrizon-theme-default-v2', 'true');
            localStorage.setItem('knowrizon-theme', 'light');
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            return;
          }
          var theme = localStorage.getItem('knowrizon-theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
